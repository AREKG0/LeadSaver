<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#0a0f18" />
    </linearGradient>
    <linearGradient id="linkedinBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B5" />
      <stop offset="100%" stop-color="#00A0DC" />
    </linearGradient>
    <linearGradient id="sheetsGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F9D58" />
      <stop offset="100%" stop-color="#2ECE71" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#F2994A" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .text-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 18px; fill: #ffffff; letter-spacing: 1px; }
      .text-sub { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #8892b0; }
      .text-code { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; fill: #2ECE71; }
      .text-card { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
      
      /* Card pulse animation */
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5; }
        50% { stroke-opacity: 1; stroke-width: 2.5; }
      }
      .card-linkedin { animation: pulseBorder 3s infinite ease-in-out; }
      .card-sheets { animation: pulseBorder 3s infinite ease-in-out 1.5s; }
      
      /* Data packets shooting across the pipeline */
      @keyframes shootPacket1 {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(250px); opacity: 0; }
      }
      @keyframes shootPacket2 {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(250px); opacity: 0; }
      }
      .packet-1 { animation: shootPacket1 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .packet-2 { animation: shootPacket1 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1) 1.2s; }
      
      /* Sheet rows lighting up when packet lands */
      @keyframes rowHighlight {
        0%, 80%, 100% { fill: #132238; stroke: #1e3354; }
        90% { fill: #123825; stroke: #2ECE71; filter: drop-shadow(0 0 8px #2ECE71); }
      }
      .sheet-row-1 { animation: rowHighlight 2.4s infinite ease-in-out 0.9s; }
      .sheet-row-2 { animation: rowHighlight 2.4s infinite ease-in-out 2.1s; }
      
      /* Counter tick bounce */
      @keyframes bounceTag {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .badge-float { animation: bounceTag 4s infinite ease-in-out; }
      
      /* Laser scan line across profile */
      @keyframes scanProfile {
        0%, 100% { transform: translateY(0px); opacity: 0.1; }
        50% { transform: translateY(110px); opacity: 0.8; }
      }
      .scan-line { animation: scanProfile 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="280" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle background grid -->
  <g stroke="#162032" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="480" y1="0" x2="480" y2="280" />
    <line x1="640" y1="0" x2="640" y2="280" />
  </g>

  <!-- Title Header -->
  <text x="35" y="42" class="text-title" fill="url(#goldGradient)" filter="url(#glowGold)">LEADSAVER :: 1-CLICK AUTOMATED PROSPECTING PIPELINE</text>
  <circle cx="745" cy="36" r="5" fill="#2ECE71" filter="url(#glowGreen)" />
  <text x="655" y="40" class="text-code">WEBHOOK LIVE</text>

  <!-- LEFT: LinkedIn Target Profile Container -->
  <g transform="translate(40, 75)">
    <rect width="210" height="170" rx="12" fill="#0c1422" stroke="#0077B5" stroke-width="2" class="card-linkedin" filter="url(#glowBlue)" />
    <!-- Header Banner -->
    <path d="M 0 12 Q 0 0 12 0 L 198 0 Q 210 0 210 12 L 210 45 L 0 45 Z" fill="url(#linkedinBlue)" opacity="0.8" />
    <text x="15" y="28" font-family="Inter" font-weight="900" font-size="12" fill="#ffffff">LINKEDIN TARGET</text>
    <circle cx="185" cy="23" r="6" fill="#ffffff" opacity="0.3" />

    <!-- Avatar Circle -->
    <circle cx="45" cy="75" r="22" fill="#1e293b" stroke="#00A0DC" stroke-width="2" />
    <circle cx="45" cy="68" r="7" fill="#8892b0" />
    <path d="M 30 87 Q 45 78 60 87 Z" fill="#8892b0" />

    <!-- Profile Data Lines -->
    <text x="78" y="70" class="text-card">Sarah Jenkins</text>
    <text x="78" y="86" class="text-sub" fill="#00A0DC">VP of Growth &amp; AI</text>

    <!-- Scraped fields boxes -->
    <rect x="15" y="110" width="180" height="22" rx="4" fill="#131e32" />
    <text x="23" y="125" font-family="JetBrains Mono" font-size="10" fill="#2ECE71">🏢 TechCorp Global</text>

    <rect x="15" y="137" width="180" height="22" rx="4" fill="#131e32" />
    <text x="23" y="152" font-family="JetBrains Mono" font-size="10" fill="#F2C94C">📍 San Francisco, CA</text>
    
    <!-- Laser scanner effect over profile -->
    <line x1="5" y1="45" x2="205" y2="45" stroke="#00A0DC" stroke-width="2" filter="url(#glowBlue)" class="scan-line" />
  </g>

  <!-- MIDDLE: The High-Velocity Data Pipeline Conduit -->
  <g transform="translate(265, 150)">
    <!-- Pipeline track -->
    <line x1="0" y1="0" x2="250" y2="0" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="0" x2="250" y2="0" stroke="#00A0DC" stroke-width="2" stroke-dasharray="6 8" opacity="0.5" />
    
    <!-- Animated Traveling Data Packets -->
    <g class="packet-1">
      <rect x="0" y="-14" width="45" height="28" rx="14" fill="url(#sheetsGreen)" filter="url(#glowGreen)" />
      <text x="10" y="3" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#ffffff">JSON</text>
    </g>
    
    <g class="packet-2">
      <rect x="0" y="-14" width="55" height="28" rx="14" fill="url(#goldGradient)" filter="url(#glowGold)" />
      <text x="10" y="3" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#000000">SHEET</text>
    </g>

    <!-- Floating status badge in center -->
    <g transform="translate(55, -55)" class="badge-float">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#101827" stroke="#2ECE71" stroke-width="1.5" filter="url(#glowGreen)" />
      <text x="18" y="20" font-family="Inter" font-weight="700" font-size="11" fill="#2ECE71">⚡ INSTANT SYNC</text>
    </g>
  </g>

  <!-- RIGHT: Google Sheets Webhook Target Matrix -->
  <g transform="translate(530, 75)">
    <rect width="230" height="170" rx="12" fill="#0c1422" stroke="#0F9D58" stroke-width="2" class="card-sheets" filter="url(#glowGreen)" />
    
    <!-- Sheets Header -->
    <path d="M 0 12 Q 0 0 12 0 L 218 0 Q 230 0 230 12 L 230 45 L 0 45 Z" fill="url(#sheetsGreen)" opacity="0.85" />
    <text x="15" y="28" font-family="Inter" font-weight="900" font-size="12" fill="#ffffff">GOOGLE SHEETS CRM</text>
    <!-- Sheets Grid Icon -->
    <rect x="195" y="14" width="20" height="18" rx="3" fill="#ffffff" opacity="0.3" />

    <!-- Table Header Row -->
    <rect x="12" y="55" width="206" height="20" fill="#16293e" />
    <text x="20" y="69" font-family="JetBrains Mono" font-size="9" font-weight="700" fill="#8892b0">NAME</text>
    <text x="85" y="69" font-family="JetBrains Mono" font-size="9" font-weight="700" fill="#8892b0">COMPANY</text>
    <text x="165" y="69" font-family="JetBrains Mono" font-size="9" font-weight="700" fill="#8892b0">STATUS</text>

    <!-- Spreadsheet Data Rows (Animate highlighting on packet arrival) -->
    <rect x="12" y="80" width="206" height="26" rx="4" class="sheet-row-1" />
    <text x="20" y="97" font-family="Inter" font-weight="600" font-size="11" fill="#ffffff">Alex Rivera</text>
    <text x="85" y="97" font-family="Inter" font-size="11" fill="#8892b0">CloudScale</text>
    <text x="165" y="97" font-family="JetBrains Mono" font-size="10" fill="#2ECE71">SAVED ✅</text>

    <rect x="12" y="112" width="206" height="26" rx="4" class="sheet-row-2" />
    <text x="20" y="129" font-family="Inter" font-weight="700" font-size="11" fill="#ffffff">Sarah Jenkins</text>
    <text x="85" y="129" font-family="Inter" font-size="11" fill="#00A0DC">TechCorp</text>
    <text x="165" y="129" font-family="JetBrains Mono" font-size="10" fill="#F2C94C">NEW! ⚡</text>

    <rect x="12" y="144" width="206" height="22" fill="#0e1726" opacity="0.6" />
    <text x="20" y="159" font-family="JetBrains Mono" font-size="10" fill="#475569">+ Ready for next lead...</text>
  </g>
</svg>
