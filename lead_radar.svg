<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111928" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="radarClip">
      <circle cx="150" cy="150" r="95" />
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .hud-title { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 16px; fill: #ffffff; letter-spacing: 1.5px; }
      .text-log { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11.5px; fill: #A7F3D0; }
      .text-timestamp { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; fill: #64748b; }
      
      /* Radar sweeping arm */
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .sweep-arm { transform-origin: 150px 150px; animation: radarSweep 4s linear infinite; }
      
      /* Blinking radar targets */
      @keyframes blinkTarget {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.4); filter: drop-shadow(0 0 8px #10B981); }
      }
      .target-1 { transform-origin: 120px 110px; animation: blinkTarget 3s infinite ease-in-out; }
      .target-2 { transform-origin: 195px 175px; animation: blinkTarget 3s infinite ease-in-out 1.2s; }
      .target-3 { transform-origin: 165px 95px; animation: blinkTarget 3s infinite ease-in-out 2.1s; }
      
      /* Live log lines typing/lighting up in sequence */
      @keyframes logHighlight {
        0%, 100% { opacity: 0.7; transform: translateX(0px); }
        15% { opacity: 1; transform: translateX(4px); }
        30% { opacity: 0.8; transform: translateX(0px); }
      }
      .log-1 { animation: logHighlight 6s infinite ease-in-out 0s; }
      .log-2 { animation: logHighlight 6s infinite ease-in-out 2s; }
      .log-3 { animation: logHighlight 6s infinite ease-in-out 4s; }
      
      /* Shield pulse */
      @keyframes shieldPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 10px #A78BFA); }
      }
      .shield-box { transform-origin: 680px 45px; animation: shieldPulse 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="280" rx="16" fill="url(#hudBg)" stroke="#1e293b" stroke-width="2" />

  <!-- LEFT: PROSPECTING RADAR ARRAY -->
  <g id="RadarScreen">
    <circle cx="150" cy="150" r="100" fill="#0c1322" stroke="#1e293b" stroke-width="3" />
    <circle cx="150" cy="150" r="95" fill="#080e1a" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="150" cy="150" r="65" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="4 6" opacity="0.3" />
    <circle cx="150" cy="150" r="35" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4" />
    <line x1="50" y1="150" x2="250" y2="150" stroke="#10B981" stroke-opacity="0.3" />
    <line x1="150" y1="50" x2="150" y2="250" stroke="#10B981" stroke-opacity="0.3" />

    <!-- Radar Sweep Beam -->
    <g clip-path="url(#radarClip)">
      <path d="M 150 150 L 250 150 A 100 100 0 0 1 150 250 Z" fill="url(#radarSweepGrad)" class="sweep-arm" />
      <line x1="150" y1="150" x2="150" y2="250" stroke="#10B981" stroke-width="2" filter="url(#glowEmerald)" class="sweep-arm" />
    </g>

    <!-- Glowing Target Dots -->
    <g class="target-1">
      <circle cx="120" cy="110" r="6" fill="#10B981" filter="url(#glowEmerald)" />
      <circle cx="120" cy="110" r="2" fill="#ffffff" />
      <text x="130" y="113" font-family="JetBrains Mono" font-size="9" fill="#10B981" font-weight="700">VP SALES</text>
    </g>
    
    <g class="target-2">
      <circle cx="195" cy="175" r="5" fill="#A78BFA" filter="url(#glowPurple)" />
      <circle cx="195" cy="175" r="2" fill="#ffffff" />
      <text x="205" y="178" font-family="JetBrains Mono" font-size="9" fill="#A78BFA" font-weight="700">FOUNDER</text>
    </g>

    <g class="target-3">
      <circle cx="165" cy="95" r="6" fill="#F59E0B" filter="url(#glowYellow)" />
      <text x="175" y="97" font-family="JetBrains Mono" font-size="9" fill="#F59E0B" font-weight="700">CEO</text>
    </g>
    
    <circle cx="150" cy="150" r="4" fill="#10B981" />
  </g>

  <!-- RIGHT: REAL-TIME TELEMETRY & DUPLICATE PROTECTION HUD -->
  <g transform="translate(285, 30)">
    <!-- Header bar -->
    <text x="0" y="20" class="hud-title" fill="#ffffff">LIVE CRM PROSPECTING HUD</text>
    
    <!-- Active Shield Badge -->
    <g transform="translate(340, -2)" class="shield-box">
      <rect width="145" height="30" rx="15" fill="#1e1B4B" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowPurple)" />
      <text x="14" y="19" font-family="Inter" font-weight="700" font-size="11" fill="#C4B5FD">🛡️ DUPLICATE SHIELD</text>
    </g>

    <!-- Terminal Box -->
    <rect x="0" y="45" width="485" height="175" rx="10" fill="#0d1421" stroke="#253347" stroke-width="1.5" />
    
    <!-- Terminal Headers -->
    <rect x="1" y="46" width="483" height="28" rx="10" fill="#152033" />
    <circle cx="20" cy="60" r="5" fill="#FF5F56" />
    <circle cx="36" cy="60" r="5" fill="#FFBD2E" />
    <circle cx="52" cy="60" r="5" fill="#27C93F" />
    <text x="80" y="64" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#94a3b8">leadsaver_telemetry_stream.log // Google Apps Script Webhook</text>

    <!-- Log List -->
    <g transform="translate(15, 95)">
      <!-- Log Line 1 -->
      <g class="log-1">
        <text x="0" y="0" class="text-timestamp">[10:24:08]</text>
        <text x="75" y="0" class="text-log" fill="#34D399">EXTRACTED ::</text>
        <text x="165" y="0" font-family="Inter" font-size="12" font-weight="600" fill="#ffffff">David K. (Senior Architect)</text>
        <rect x="360" y="-12" width="80" height="18" rx="4" fill="#065f46" />
        <text x="368" y="1" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#A7F3D0">ROW #394 ✅</text>
      </g>

      <!-- Log Line 2 -->
      <g transform="translate(0, 32)" class="log-2">
        <text x="0" y="0" class="text-timestamp">[10:26:14]</text>
        <text x="75" y="0" font-family="JetBrains Mono" font-size="11.5" font-weight="700" fill="#F59E0B">DUPLICATE ::</text>
        <text x="165" y="0" font-family="Inter" font-size="12" font-weight="600" fill="#cbd5e1">Elena Rostova (Tech Founder)</text>
        <rect x="360" y="-12" width="80" height="18" rx="4" fill="#4c1d95" />
        <text x="368" y="1" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#C4B5FD">SKIPPED 🛡️</text>
      </g>

      <!-- Log Line 3 -->
      <g transform="translate(0, 64)" class="log-3">
        <text x="0" y="0" class="text-timestamp">[10:28:42]</text>
        <text x="75" y="0" font-family="JetBrains Mono" font-size="11.5" font-weight="700" fill="#38BDF8">WEBHOOK ::</text>
        <text x="165" y="0" font-family="Inter" font-size="12" fill="#94a3b8">Google Sheets Script Sync Latency</text>
        <text x="375" y="0" font-family="JetBrains Mono" font-size="12" font-weight="700" fill="#38BDF8">46.2 ms ⚡</text>
      </g>

      <!-- Prompt Line -->
      <g transform="translate(0, 95)">
        <text x="0" y="0" font-family="JetBrains Mono" font-size="12" fill="#10B981">➜</text>
        <text x="20" y="0" font-family="JetBrains Mono" font-size="11.5" fill="#64748b">Listening for LinkedIn target profiles... [STATUS: OPTIMAL]</text>
        <rect x="420" y="-10" width="7" height="14" fill="#10B981" />
      </g>
    </g>
  </g>
</svg>
